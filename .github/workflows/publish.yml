name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: npm Trusted Publishing / provenance 需要
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Ensure npm >= 11.5 (OIDC trust requirement)
        run: npm install -g npm@latest >/dev/null 2>&1 && npm --version

      - name: Install dev deps
        run: npm i -D typescript @types/node

      - name: Typecheck + tests
        run: |
          bunx tsc -p tsconfig.json --noEmit
          bun ./src/rewrite.test.ts
          bun ./src/coexistence.test.ts

      - name: Secrets scan gate (verified only, quick)
        uses: trufflesecurity/trufflehog@v3.88.2
        with:
          path: ./
          extra_args: --results=verified

      # 双模式发布：
      #  - 若仓库配置了 GitHub Secrets 的 NPM_TOKEN → 传统 token 发布
      #  - 若 npm 侧已关联 Trusted Publisher（OIDC）→ 自动走可信发布，无需 token
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
