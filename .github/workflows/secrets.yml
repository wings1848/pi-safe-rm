name: Secrets scan

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 0" # 每周深扫（未验证+已验证）
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史扫描

      - name: TruffleHog (verified + unknown)
        uses: trufflesecurity/trufflehog@v3.97.1
        with:
          path: ./
          extra_args: --results=verified,unknown
